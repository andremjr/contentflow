name: Publish ContentFlow v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.1.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout v1.1.0
        uses: actions/checkout@v4
        with:
          ref: v1.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package ecosystem
        run: |
          npm run ecosystem:package
          npm run ecosystem:catalog

      - name: Build Windows release
        run: npm run desktop:release

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $setup = 'release/v1/ContentFlow-V1-1.1.0-x64-Setup.exe'
          $portable = 'release/v1/ContentFlow-V1-1.1.0-x64-Portable.exe'
          $manifest = 'release/v1/ContentFlow-V1-1.1.0-SHA256.txt'
          $lines = @(
            "$(Get-FileHash $setup -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $(Split-Path $setup -Leaf)",
            "$(Get-FileHash $portable -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $(Split-Path $portable -Leaf)"
          )
          [IO.File]::WriteAllLines($manifest, $lines, [Text.Encoding]::ASCII)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: ContentFlow v1.1.0
          generate_release_notes: true
          make_latest: true
          files: |
            release/v1/ContentFlow-V1-1.1.0-x64-Setup.exe
            release/v1/ContentFlow-V1-1.1.0-x64-Portable.exe
            release/v1/ContentFlow-V1-1.1.0-x64-Setup.exe.blockmap
            release/v1/ContentFlow-V1-1.1.0-SHA256.txt
            release/v1/latest.yml
            release/ecosystem/catalog.json
            release/ecosystem/ContentFlow-Browser-Bridge.zip
            release/ecosystem/ContentFlow-Plugin-Catalog.json
            release/ecosystem/ContentFlow-Plugin-*.zip
            release/ecosystem/ContentFlow-Plugins.zip
            release/ecosystem/ContentFlow-Skill-Method-Development.zip
            release/ecosystem/ContentFlow-Skill-Plugin-Development.zip
