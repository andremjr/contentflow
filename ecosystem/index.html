<!doctype html>
<html lang="pt-BR">
  <head>
    <base href="../">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ecossistema — ContentFlow</title>
    <link rel="icon" href="logo-mark.png">
    <link rel="stylesheet" href="shared-header.css">
    <link rel="stylesheet" href="ecosystem.css?v=filters-20260914">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./"><img src="logo-mark.png" alt=""><span>Content<b>Flow</b></span></a>
      <nav>
        <a href="./#como-funciona" data-i18n="navFlow">Como funciona</a>
        <a href="community/" data-i18n="navCommunity">Comunidade VIP</a>
        <a href="ecosystem/" data-i18n="navEcosystem">Ecossistema</a>
        <a href="concept/" data-i18n="navConcept">Conceito</a>
      </nav>
      <div class="header-actions">
        <div class="language">
          <button data-language="pt" aria-pressed="true">PT</button>
          <button data-language="en">EN</button>
          <button data-language="es">ES</button>
        </div>
        <a class="download compact" href="https://github.com/andremjr/contentflow/releases/download/v0.7.2/ContentFlow-V0-0.7.2-x64-Setup.exe"><span class="windows">⊞</span><span data-i18n="downloadHeader">Baixar para Windows</span></a>
      </div>
    </header>
    <main>
      <section class="catalog" aria-label="Ecosystem catalog">
        <div class="toolbar">
          <div class="tabs">
            <button class="tab active" data-kind="plugins" data-i18n="plugins">Plugins</button>
            <button class="tab" data-kind="methods" data-i18n="methods">Métodos</button>
          </div>
          <span id="selection-count" class="selection-count" aria-live="polite"></span>
          <button id="download-selected" class="download-selected" disabled data-i18n="downloadSelected">Baixar selecionados</button>
        </div>
        <div class="filter-row">
          <input id="search" class="filter-control search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel" placeholder="Pesquisar por nome ou função" aria-label="Pesquisar por nome ou função">
          <select id="delivery-filter" class="filter-control" aria-label="Tipo">
            <option value="all" data-i18n="allTypes">Todos os tipos</option><option value="text" data-i18n="text">Gerador de texto</option><option value="image" data-i18n="image">Gerador de imagem</option><option value="audio" data-i18n="audio">Áudio</option><option value="video" data-i18n="video">Vídeo</option><option value="srt">SRT</option><option value="processing" data-i18n="tool">Ferramenta</option>
          </select>
          <select id="process-filter" class="filter-control" aria-label="Processo">
            <option value="all" data-i18n="allProcesses">Todos os processos</option><option value="theme" data-i18n="theme">Tema</option><option value="title" data-i18n="title">Título</option><option value="thumbnail" data-i18n="thumbnail">Thumbnail</option><option value="script" data-i18n="script">Roteiro</option><option value="narration" data-i18n="narration">Narração</option><option value="assets" data-i18n="assets">Assets</option><option value="editing" data-i18n="editing">Edição</option><option value="publishing" data-i18n="publishing">Publicação</option>
          </select>
          <span id="result-count" class="result-count" aria-live="polite"></span>
        </div>
        <section id="gallery" class="gallery"></section>
      </section>
    </main>
    <footer><span>© 2026 ContentFlow</span><a href="./" data-i18n="home">Início</a></footer>
    <script src="ecosystem.js?v=filters-20260914"></script>
  </body>
</html>
